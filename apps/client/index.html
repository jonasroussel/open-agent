<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Installable on the home screen (PWA). No service worker: every answer needs the network anyway. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Set by the theme script below and `src/theme/theme.ts`: it follows the app's theme, not only the device's. -->
    <meta name="theme-color" content="#f6f0e4" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Open Agent" />
    <title>Open Agent</title>
    <!--
      Before the first paint, so a dark theme never flashes white. Kept in sync with `src/theme/theme.ts` and the
      `--background` colors of `src/index.css`, which loads later.
    -->
    <style>
      html {
        background: oklch(0.992 0.009 85);
      }
      html.dark {
        background: oklch(0.205 0.005 260);
        color-scheme: dark;
      }
      /* The loading screen, replaced by the app once `src/main.tsx` has the font and the first page ready. Shown
         after a short delay, so a fast load does not flash it. */
      .loading-screen {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        animation: loading-screen-in 0.3s ease-out 0.2s both;
      }
      .loading-screen img {
        animation: loading-screen-pulse 1.6s ease-in-out infinite;
      }
      @keyframes loading-screen-in {
        from {
          opacity: 0;
        }
      }
      @keyframes loading-screen-pulse {
        50% {
          opacity: 0.55;
          transform: scale(0.94);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .loading-screen img {
          animation: none;
        }
      }
    </style>
    <script>
      {
        const theme = localStorage.getItem('theme');
        const dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.querySelector('meta[name="theme-color"]').content = dark ? '#0f1112' : '#f6f0e4';
      }
    </script>
  </head>
  <body>
    <div id="root">
      <div class="loading-screen" role="status" aria-label="Open Agent">
        <img src="/icon.svg" alt="" width="64" height="64" />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
